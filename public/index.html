<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SiteForge Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0a0a0b', 900: '#111114', 800: '#17171c', 700: '#1f1f26', 600: '#2a2a33' },
            accent: { DEFAULT: '#7c5cff', soft: '#5b46d6' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .drop-active { border-color: #7c5cff !important; background: rgba(124,92,255,0.08); }
    .modal { background: rgba(0,0,0,0.6); }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body class="bg-ink-950 text-zinc-100 min-h-screen">
  <header class="border-b border-ink-700 bg-ink-900/70 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-accent-soft grid place-items-center font-bold">SF</div>
        <div>
          <div class="font-semibold leading-none">SiteForge Host</div>
          <div class="text-xs text-zinc-400 mt-1">Self-hosted static site dashboard</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="newSiteBtn" class="bg-accent hover:bg-accent-soft transition rounded-lg px-3 py-1.5 text-sm font-medium">+ Deploy site</button>
        <button id="logoutBtn" class="bg-ink-800 hover:bg-ink-700 transition rounded-lg px-3 py-1.5 text-sm">Sign out</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div id="empty" class="hidden text-center py-20 border border-dashed border-ink-700 rounded-2xl">
      <div class="text-zinc-300 text-lg font-medium">No sites yet</div>
      <div class="text-zinc-500 text-sm mt-2">Click <span class="text-accent">+ Deploy site</span> and drop a ZIP to get started.</div>
    </div>

    <div id="sites" class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Deploy modal -->
  <div id="deployModal" class="hidden fixed inset-0 modal items-center justify-center p-4 z-20">
    <div class="bg-ink-900 border border-ink-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h2 id="deployTitle" class="text-lg font-semibold">Deploy a new site</h2>
        <button data-close class="text-zinc-400 hover:text-white">&times;</button>
      </div>
      <form id="deployForm" class="space-y-4">
        <div id="newFields">
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Site name</label>
          <input id="siteName" type="text" placeholder="My portfolio"
            class="w-full bg-ink-800 border border-ink-600 rounded-lg px-3 py-2 outline-none focus:border-accent" />
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mt-3 mb-2">Slug (URL)</label>
          <div class="flex items-center gap-2 text-zinc-400 text-sm">
            <span class="text-zinc-500">/s/</span>
            <input id="siteSlug" type="text" pattern="[a-z0-9-]+" placeholder="my-portfolio"
              class="flex-1 bg-ink-800 border border-ink-600 rounded-lg px-3 py-2 outline-none focus:border-accent text-zinc-100" />
            <span class="text-zinc-500">/</span>
          </div>
          <p class="text-xs text-zinc-500 mt-1">Lowercase letters, digits, and hyphens.</p>
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">ZIP file</label>
          <label id="drop" for="zipInput"
            class="block border-2 border-dashed border-ink-600 rounded-xl px-6 py-10 text-center cursor-pointer hover:border-accent transition">
            <div class="text-zinc-200" id="dropLabel">Drop a ZIP here, or click to choose</div>
            <div class="text-xs text-zinc-500 mt-1">HTML / CSS / JS only. Site must contain index.html.</div>
            <input id="zipInput" type="file" accept=".zip,application/zip" class="hidden" />
          </label>
        </div>

        <div id="deployErr" class="hidden text-sm text-rose-400"></div>

        <div class="flex items-center justify-end gap-2">
          <button type="button" data-close class="px-4 py-2 rounded-lg bg-ink-800 hover:bg-ink-700 text-sm">Cancel</button>
          <button id="deploySubmit" type="submit" class="px-4 py-2 rounded-lg bg-accent hover:bg-accent-soft text-sm font-medium disabled:opacity-50">Deploy</button>
        </div>
      </form>
    </div>
  </div>

  <!-- File manager modal -->
  <div id="filesModal" class="hidden fixed inset-0 modal items-center justify-center p-4 z-20">
    <div class="bg-ink-900 border border-ink-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl flex flex-col" style="max-height: 85vh">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Files - <span id="filesSite" class="text-zinc-300"></span></h2>
        <button data-close-files class="text-zinc-400 hover:text-white">&times;</button>
      </div>
      <div id="fileTree" class="flex-1 overflow-auto border border-ink-700 rounded-xl p-3 text-sm bg-ink-950"></div>
      <div class="mt-4 flex items-center gap-2">
        <input id="filePathInput" type="text" placeholder="path/in/site.html"
          class="flex-1 bg-ink-800 border border-ink-600 rounded-lg px-3 py-2 outline-none focus:border-accent text-sm" />
        <label class="px-3 py-2 rounded-lg bg-ink-800 hover:bg-ink-700 text-sm cursor-pointer">
          Upload
          <input id="fileUploadInput" type="file" class="hidden" />
        </label>
      </div>
      <p class="text-xs text-zinc-500 mt-2">Type the destination path, then choose a file to replace or add it.</p>
    </div>
  </div>

  <div id="toasts" class="fixed bottom-4 right-4 space-y-2 z-30"></div>

  <script src="/static/app.js"></script>
</body>
</html>
