<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0e7490" />
  <title>PR Property Scout — Puerto Rico</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
/* ─────────────────────────────────────────────────────────────
   PR Property Scout — clean, professional, touch-friendly
   ───────────────────────────────────────────────────────────── */
:root {
  --bg:        #f4f6f8;
  --surface:   #ffffff;
  --ink:       #16242e;
  --ink-soft:  #5b6b76;
  --line:      #e2e8ed;
  --brand:     #0e7490;   /* teal — ties to Fix Up brand */
  --brand-dk:  #0b5566;
  --danger:    #dc2626;
  --shadow:    0 6px 24px rgba(16, 36, 46, 0.12);

  /* Deal-status palette */
  --s-interested:     #2563eb;  /* blue   */
  --s-contacted:      #0e7490;  /* teal   */
  --s-offer:          #d97706;  /* amber  */
  --s-contract:       #16a34a;  /* green  */
  --s-passed:         #6b7280;  /* gray   */

  --radius: 12px;
  --header-h: 56px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

/* ───────────── Top bar ───────────── */
.topbar {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--brand);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  position: relative;
  z-index: 1200;
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.brand-mark { font-size: 20px; }
.brand-text { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub  { font-size: 12px; opacity: .8; white-space: nowrap; }
@media (max-width: 520px) { .brand-sub { display: none; } }

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

/* Compact, tidy top bar on phones so the title never collides with the
   Import / Export buttons. */
@media (max-width: 600px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .topbar-actions { gap: 6px; }
  .topbar-actions .btn {
    padding: 8px 14px;
    font-size: 13px;
    min-height: 36px;
    border-radius: 999px;
  }
  .brand-text { font-size: 15px; }
  .brand-mark { font-size: 18px; }
  .count-badge { display: none; }   /* count still shows in the sidebar */
}
.count-badge {
  background: rgba(255,255,255,.2);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 13px;
  font-weight: 600;
  min-width: 28px;
  text-align: center;
}

/* ───────────── Layout ───────────── */
.layout {
  display: flex;
  height: calc(100% - var(--header-h));
  position: relative;
}
.sidebar {
  width: 320px;
  flex: 0 0 320px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: margin-left .25s ease, transform .25s ease;
}
.sidebar.collapsed { margin-left: -320px; }

/* On phones/tablets the sidebar floats OVER the map instead of squeezing it.
   It is HIDDEN by default (pure CSS — no JS required) so the map always gets
   the full screen, and slides in only when the ☰ button adds .open. */
@media (max-width: 768px) {
  .sidebar {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    z-index: 1100;
    width: 86%;
    max-width: 340px;
    flex-basis: auto;
    margin-left: 0;
    box-shadow: var(--shadow);
    transform: translateX(-105%);
  }
  .sidebar.open { transform: translateX(0); }
}

.sidebar-head { padding: 12px; border-bottom: 1px solid var(--line); }
.search {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}
.search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,116,144,.15); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-soft);
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.property-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.property-list li {
  padding: 11px 12px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  gap: 10px;
  align-items: center;
}
.property-list li:hover, .property-list li.active { background: #eef4f6; }
.pl-thumb {
  width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
  background: var(--line); flex: 0 0 44px;
}
.pl-thumb.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 18px; }
.pl-body { min-width: 0; flex: 1; }
.pl-addr { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.status-chip {
  font-size: 11px; font-weight: 600; color: #fff;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}

.empty-state { padding: 24px; color: var(--ink-soft); font-size: 14px; text-align: center; }

/* ───────────── Map ───────────── */
.map-wrap { position: relative; flex: 1; }
#map { position: absolute; inset: 0; background: #e8edf0; }
.map-fallback {
  position: absolute; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
  color: var(--ink-soft); font-size: 15px; line-height: 1.5;
}
.map-hint {
  position: absolute;
  top: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(22,36,46,.85); color: #fff;
  padding: 7px 14px; border-radius: 999px;
  font-size: 13px; z-index: 500; pointer-events: none;
  box-shadow: var(--shadow);
}

/* Custom pin markers */
.pin {
  width: 26px; height: 26px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,.35);
}
.pin::after {
  content: ""; position: absolute;
  top: 7px; left: 7px; width: 8px; height: 8px;
  background: #fff; border-radius: 50%;
}

/* ───────────── Buttons ───────────── */
.btn {
  border: none; cursor: pointer;
  padding: 11px 16px; border-radius: 10px;
  font-size: 15px; font-weight: 600;
  min-height: 44px;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dk); }
.btn-ghost { background: transparent; color: inherit; border: 1px solid currentColor; opacity: .9; }
.btn-ghost:hover { opacity: 1; }
.topbar .btn-ghost { border-color: rgba(255,255,255,.5); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.icon-btn {
  background: transparent; border: none; cursor: pointer;
  color: inherit; font-size: 22px; line-height: 1;
  width: 40px; height: 40px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: rgba(0,0,0,.06); }
.topbar .icon-btn:hover { background: rgba(255,255,255,.15); }
.hamburger, .hamburger::before, .hamburger::after {
  display: block; width: 20px; height: 2px; background: currentColor; border-radius: 2px; position: relative;
}
.hamburger::before, .hamburger::after { content: ""; position: absolute; left: 0; }
.hamburger::before { top: -6px; } .hamburger::after { top: 6px; }

/* ───────────── Modal ───────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(16,36,46,.5);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
}
@media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }

.modal {
  background: var(--surface);
  width: 100%; max-width: 480px;
  border-radius: 16px 16px 0 0;
  max-height: 92vh; overflow-y: auto;
  box-shadow: var(--shadow);
  animation: slideUp .22s ease;
}
@media (min-width: 640px) { .modal { border-radius: 16px; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }

.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 8px;
}
.modal-head h2 { margin: 0; font-size: 18px; }

.form { padding: 4px 16px 16px; }
.field { display: block; margin-bottom: 14px; }
.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
.field-label small { font-weight: 400; }
.field input[type=text], .field select, .field textarea {
  width: 100%; padding: 12px; font-size: 16px;
  border: 1px solid var(--line); border-radius: 10px;
  outline: none; font-family: inherit; background: #fff;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,116,144,.15);
}
.field textarea { resize: vertical; }

.image-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.image-preview .thumb {
  position: relative; width: 76px; height: 76px;
  border-radius: 10px; overflow: hidden; background: var(--line);
}
.image-preview .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.image-preview .thumb .rm {
  position: absolute; top: 2px; right: 2px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff; border: none;
  cursor: pointer; font-size: 14px; line-height: 1;
}
.upload-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 14px; border: 1.5px dashed var(--brand); color: var(--brand);
  border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.upload-btn.disabled { opacity: .4; pointer-events: none; }

.modal-actions { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.modal-actions .spacer { flex: 1; }

/* ───────────── Popup summary card ───────────── */
.leaflet-popup-content { margin: 0; }
.leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; }
.card { width: 240px; }
.card-head { padding: 12px 14px 8px; }
.card-addr { font-weight: 700; font-size: 15px; }
.card-status { display: inline-block; margin-top: 6px; }
.card-notes { padding: 0 14px 10px; font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; }
.card-thumbs { display: flex; gap: 6px; padding: 0 14px 12px; }
.card-thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
.card-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.card-actions .btn { flex: 1; padding: 9px; font-size: 14px; min-height: 40px; }

/* ───────────── Lightbox ───────────── */
.lightbox {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,.9);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.lightbox-close { position: absolute; top: 12px; right: 12px; color: #fff; font-size: 32px; }

[hidden] { display: none !important; }

  </style>
</head>
<body>
  <!-- ───────────── Top bar ───────────── -->
  <header class="topbar">
    <button id="toggleSidebar" class="icon-btn" aria-label="Toggle property list" title="Toggle list">
      <span class="hamburger"></span>
    </button>
    <div class="brand">
      <span class="brand-mark">📍</span>
      <span class="brand-text">PR Property Scout</span>
      <span class="brand-sub">All of Puerto Rico</span>
    </div>
    <div class="topbar-actions">
      <span id="countBadge" class="count-badge" title="Saved properties">0</span>
      <button id="importBtn" class="btn btn-ghost" title="Import properties from a JSON file">Import</button>
      <button id="exportBtn" class="btn btn-ghost" title="Download all properties as JSON">Export</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
    </div>
  </header>

  <div class="layout">
    <!-- ───────────── Sidebar ───────────── -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <input id="searchInput" type="search" class="search" placeholder="Search address or notes…" autocomplete="off" />
      </div>
      <div class="legend" id="legend"></div>
      <ul id="propertyList" class="property-list"></ul>
      <p id="emptyState" class="empty-state">
        Tap anywhere on the map to drop your first pin.
      </p>
    </aside>

    <!-- ───────────── Map ───────────── -->
    <main class="map-wrap">
      <div id="map">
        <div class="map-fallback" id="mapFallback">
          <noscript>
            <strong>This app needs JavaScript.</strong><br>
            Open this file in Safari or Chrome to load the map.
          </noscript>
        </div>
      </div>
      <div class="map-hint" id="mapHint">Tap the map to add a property</div>
    </main>
  </div>

  <!-- ───────────── Edit / Add modal ───────────── -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">New property</h2>
        <button id="modalClose" class="icon-btn" aria-label="Close">&times;</button>
      </div>

      <form id="propertyForm" class="form">
        <label class="field">
          <span class="field-label">Address</span>
          <input id="fAddress" type="text" placeholder="123 Calle Marina, Ponce, PR" />
        </label>

        <label class="field">
          <span class="field-label">Deal status</span>
          <select id="fStatus">
            <option value="Interested">Interested</option>
            <option value="Contacted">Contacted</option>
            <option value="Offer Pending">Offer Pending</option>
            <option value="Under Contract">Under Contract</option>
            <option value="Passed">Passed</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Notes</span>
          <textarea id="fNotes" rows="3" placeholder="Asking price, condition, owner contact, comps…"></textarea>
        </label>

        <div class="field">
          <span class="field-label">Photos <small>(up to 3)</small></span>
          <div id="imagePreview" class="image-preview"></div>
          <label class="upload-btn" id="uploadLabel">
            <input id="fImages" type="file" accept="image/*" multiple capture="environment" hidden />
            <span>+ Add photos</span>
          </label>
        </div>

        <input type="hidden" id="fId" />
        <input type="hidden" id="fLat" />
        <input type="hidden" id="fLng" />

        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="btn btn-danger" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ───────────── Lightbox ───────────── -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close icon-btn" aria-label="Close">&times;</button>
    <img id="lightboxImg" alt="Property photo" />
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
/* ─────────────────────────────────────────────────────────────
   PR Property Scout — Leaflet + localStorage, no backend.
   ───────────────────────────────────────────────────────────── */
(function () {
  "use strict";

  // ── Config ──────────────────────────────────────────────────
  // Whole-island view: main island + Vieques & Culebra. The map opens
  // framed on all of Puerto Rico; tiles stay detailed down to the street.
  const PR_BOUNDS = [[17.85, -67.30], [18.57, -65.20]];
  const STORAGE_KEY = "pr_property_scout_v1";
  const MAX_IMAGES = 3;
  const IMG_MAX_DIM = 1024;   // px — longest edge after compression
  const IMG_QUALITY = 0.7;    // JPEG quality

  const STATUSES = [
    { name: "Interested",     color: "#2563eb" },
    { name: "Contacted",      color: "#0e7490" },
    { name: "Offer Pending",  color: "#d97706" },
    { name: "Under Contract", color: "#16a34a" },
    { name: "Passed",         color: "#6b7280" },
  ];
  const colorFor = (status) =>
    (STATUSES.find((s) => s.name === status) || STATUSES[0]).color;

  // ── State ───────────────────────────────────────────────────
  /** @type {Array<Object>} */
  let properties = load();
  const markers = new Map();   // id -> L.marker
  let pendingImages = [];       // base64 strings while editing
  let searchTerm = "";

  // ── DOM refs ────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const els = {
    sidebar: $("sidebar"),
    toggleSidebar: $("toggleSidebar"),
    list: $("propertyList"),
    empty: $("emptyState"),
    search: $("searchInput"),
    legend: $("legend"),
    countBadge: $("countBadge"),
    exportBtn: $("exportBtn"),
    importBtn: $("importBtn"), importFile: $("importFile"),
    mapHint: $("mapHint"),
    // modal
    overlay: $("modalOverlay"),
    modalTitle: $("modalTitle"),
    modalClose: $("modalClose"),
    form: $("propertyForm"),
    fId: $("fId"), fLat: $("fLat"), fLng: $("fLng"),
    fAddress: $("fAddress"), fStatus: $("fStatus"), fNotes: $("fNotes"),
    fImages: $("fImages"), imagePreview: $("imagePreview"), uploadLabel: $("uploadLabel"),
    deleteBtn: $("deleteBtn"), cancelBtn: $("cancelBtn"),
    // lightbox
    lightbox: $("lightbox"), lightboxImg: $("lightboxImg"),
  };

  // ── Storage ─────────────────────────────────────────────────
  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      console.warn("Could not parse stored properties:", e);
      return [];
    }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(properties));
    } catch (e) {
      alert(
        "Storage limit reached. Try removing some photos or older properties.\n\n" + e.message
      );
    }
  }

  // ── Map setup ───────────────────────────────────────────────
  const map = L.map("map", { zoomControl: true, minZoom: 8 }).fitBounds(PR_BOUNDS);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  map.on("click", (e) => openForm(null, e.latlng.lat, e.latlng.lng));

  function pinIcon(status) {
    return L.divIcon({
      className: "",
      html: `<div class="pin" style="background:${colorFor(status)}"></div>`,
      iconSize: [26, 26],
      iconAnchor: [13, 26],
      popupAnchor: [0, -26],
    });
  }

  function addMarker(p) {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(p.status) }).addTo(map);
    m.bindPopup(() => cardHtml(p), { minWidth: 240, closeButton: true });
    m.on("popupopen", () => wireCard(p));
    markers.set(p.id, m);
    return m;
  }

  function refreshMarker(p) {
    const m = markers.get(p.id);
    if (m) {
      m.setIcon(pinIcon(p.status));
      m.setLatLng([p.lat, p.lng]);
    } else {
      addMarker(p);
    }
  }

  // ── Summary card (popup) ────────────────────────────────────
  function cardHtml(p) {
    const thumbs = (p.images || [])
      .map((src, i) => `<img src="${src}" data-i="${i}" alt="Photo ${i + 1}">`)
      .join("");
    return `
      <div class="card" data-id="${p.id}">
        <div class="card-head">
          <div class="card-addr">${escapeHtml(p.address) || "Untitled property"}</div>
          <span class="status-chip card-status" style="background:${colorFor(p.status)}">${p.status}</span>
        </div>
        ${p.notes ? `<div class="card-notes">${escapeHtml(p.notes)}</div>` : ""}
        ${thumbs ? `<div class="card-thumbs">${thumbs}</div>` : ""}
        <div class="card-actions">
          <button class="btn btn-ghost" data-act="edit">Edit</button>
          <button class="btn btn-danger" data-act="delete">Delete</button>
        </div>
      </div>`;
  }

  function wireCard(p) {
    const root = document.querySelector(`.card[data-id="${p.id}"]`);
    if (!root) return;
    root.querySelector('[data-act="edit"]').onclick = () =>
      openForm(p.id, p.lat, p.lng);
    root.querySelector('[data-act="delete"]').onclick = () => removeProperty(p.id);
    root.querySelectorAll(".card-thumbs img").forEach((img) => {
      img.onclick = () => openLightbox(img.src);
    });
  }

  // ── Form / modal ────────────────────────────────────────────
  function openForm(id, lat, lng) {
    const editing = !!id;
    const p = editing ? properties.find((x) => x.id === id) : null;

    els.modalTitle.textContent = editing ? "Edit property" : "New property";
    els.fId.value = id || "";
    els.fLat.value = (p ? p.lat : lat);
    els.fLng.value = (p ? p.lng : lng);
    els.fAddress.value = p ? p.address : "";
    els.fStatus.value = p ? p.status : "Interested";
    els.fNotes.value = p ? p.notes : "";
    pendingImages = p ? [...(p.images || [])] : [];
    els.deleteBtn.hidden = !editing;

    renderImagePreview();
    els.overlay.hidden = false;
    setTimeout(() => els.fAddress.focus(), 50);
  }

  function closeForm() {
    els.overlay.hidden = true;
    els.form.reset();
    pendingImages = [];
  }

  function renderImagePreview() {
    els.imagePreview.innerHTML = pendingImages
      .map(
        (src, i) => `
        <div class="thumb">
          <img src="${src}" alt="Photo ${i + 1}">
          <button type="button" class="rm" data-i="${i}" aria-label="Remove">&times;</button>
        </div>`
      )
      .join("");
    els.imagePreview.querySelectorAll(".rm").forEach((btn) => {
      btn.onclick = () => {
        pendingImages.splice(Number(btn.dataset.i), 1);
        renderImagePreview();
      };
    });
    const full = pendingImages.length >= MAX_IMAGES;
    els.uploadLabel.classList.toggle("disabled", full);
    els.uploadLabel.querySelector("span").textContent = full
      ? `Max ${MAX_IMAGES} photos`
      : `+ Add photos`;
  }

  els.fImages.addEventListener("change", async (e) => {
    const files = [...e.target.files];
    for (const file of files) {
      if (pendingImages.length >= MAX_IMAGES) break;
      try {
        pendingImages.push(await compressImage(file));
        renderImagePreview();
      } catch (err) {
        console.warn("Image processing failed:", err);
      }
    }
    e.target.value = ""; // allow re-selecting same file
  });

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const id = els.fId.value || cryptoId();
    const existing = properties.find((x) => x.id === id);
    const record = {
      id,
      lat: parseFloat(els.fLat.value),
      lng: parseFloat(els.fLng.value),
      address: els.fAddress.value.trim(),
      status: els.fStatus.value,
      notes: els.fNotes.value.trim(),
      images: pendingImages,
      createdAt: existing ? existing.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };

    if (existing) {
      Object.assign(existing, record);
    } else {
      properties.push(record);
    }
    save();
    refreshMarker(record);
    renderList();
    closeForm();
    markers.get(id)?.openPopup();
  });

  function removeProperty(id) {
    if (!confirm("Delete this property and its photos?")) return;
    properties = properties.filter((p) => p.id !== id);
    const m = markers.get(id);
    if (m) { map.removeLayer(m); markers.delete(id); }
    save();
    renderList();
    closeForm();
  }

  // ── Sidebar list ────────────────────────────────────────────
  function renderList() {
    els.countBadge.textContent = properties.length;
    els.mapHint.style.display = properties.length ? "none" : "block";
    const term = searchTerm.toLowerCase();
    const visible = properties
      .filter(
        (p) =>
          !term ||
          (p.address || "").toLowerCase().includes(term) ||
          (p.notes || "").toLowerCase().includes(term)
      )
      .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));

    els.empty.hidden = properties.length !== 0;
    if (properties.length && !visible.length) {
      els.empty.hidden = false;
      els.empty.textContent = "No matches.";
    } else if (properties.length) {
      els.empty.textContent = "Tap anywhere on the map to drop your first pin.";
    }

    els.list.innerHTML = visible
      .map((p) => {
        const thumb = (p.images && p.images[0])
          ? `<img class="pl-thumb" src="${p.images[0]}" alt="">`
          : `<div class="pl-thumb placeholder">🏠</div>`;
        return `
        <li data-id="${p.id}">
          ${thumb}
          <div class="pl-body">
            <div class="pl-addr">${escapeHtml(p.address) || "Untitled property"}</div>
            <div class="pl-meta">
              <span class="status-chip" style="background:${colorFor(p.status)}">${p.status}</span>
              ${p.images && p.images.length ? `<span>📷 ${p.images.length}</span>` : ""}
            </div>
          </div>
        </li>`;
      })
      .join("");

    els.list.querySelectorAll("li").forEach((li) => {
      li.onclick = () => focusProperty(li.dataset.id);
    });
  }

  function focusProperty(id) {
    const p = properties.find((x) => x.id === id);
    if (!p) return;
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15), { animate: true });
    markers.get(id)?.openPopup();
    if (isMobile()) els.sidebar.classList.remove("open"); // close overlay
  }

  function renderLegend() {
    els.legend.innerHTML = STATUSES.map(
      (s) =>
        `<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.name}</span>`
    ).join("");
  }

  // ── Export ──────────────────────────────────────────────────
  els.exportBtn.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(properties, null, 2)], {
      type: "application/json",
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pr-property-scout-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ── Import ──────────────────────────────────────────────────
  // Load a JSON exported from another device and merge it in. Union by
  // id (no duplicates); when the same property exists on both sides, the
  // most recently edited copy wins.
  function rebuildAll() {
    markers.forEach((m) => map.removeLayer(m));
    markers.clear();
    properties.forEach(addMarker);
    renderList();
  }

  function mergeImport(incoming) {
    const byId = new Map(properties.map((p) => [p.id, p]));
    let added = 0, updated = 0;
    incoming.forEach((r) => {
      if (!r || !r.id || typeof r.lat !== "number" || typeof r.lng !== "number") return;
      const ex = byId.get(r.id);
      if (!ex) { byId.set(r.id, r); added++; }
      else if ((r.updatedAt || "") > (ex.updatedAt || "")) { byId.set(r.id, r); updated++; }
    });
    properties = [...byId.values()];
    return { added, updated };
  }

  els.importBtn.addEventListener("click", () => els.importFile.click());
  els.importFile.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data : (data && data.properties);
        if (!Array.isArray(list)) throw new Error("That file isn't a property export.");
        const { added, updated } = mergeImport(list);
        save();
        rebuildAll();
        alert(
          added || updated
            ? `Import complete: ${added} new, ${updated} updated.`
            : "Nothing new to import — everything was already here."
        );
      } catch (err) {
        alert(
          "Couldn't import that file. Pick a .json that was exported from this app.\n\n" +
          err.message
        );
      }
      els.importFile.value = ""; // allow re-importing the same file
    };
    reader.onerror = () => {
      alert("Couldn't read the file.");
      els.importFile.value = "";
    };
    reader.readAsText(file);
  });

  // ── Lightbox ────────────────────────────────────────────────
  function openLightbox(src) {
    els.lightboxImg.src = src;
    els.lightbox.hidden = false;
  }
  els.lightbox.addEventListener("click", () => (els.lightbox.hidden = true));

  // ── Image compression (canvas → JPEG base64) ────────────────
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > IMG_MAX_DIM) {
            height = Math.round((height * IMG_MAX_DIM) / width);
            width = IMG_MAX_DIM;
          } else if (height > IMG_MAX_DIM) {
            width = Math.round((width * IMG_MAX_DIM) / height);
            height = IMG_MAX_DIM;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", IMG_QUALITY));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ── Helpers ─────────────────────────────────────────────────
  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }
  function cryptoId() {
    return (crypto.randomUUID && crypto.randomUUID()) ||
      Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ── Wire static controls ────────────────────────────────────
  els.modalClose.onclick = closeForm;
  els.cancelBtn.onclick = closeForm;
  els.deleteBtn.onclick = () => els.fId.value && removeProperty(els.fId.value);
  els.overlay.addEventListener("click", (e) => {
    if (e.target === els.overlay) closeForm();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (!els.lightbox.hidden) els.lightbox.hidden = true;
      else if (!els.overlay.hidden) closeForm();
    }
  });
  els.toggleSidebar.onclick = () => {
    if (isMobile()) {
      els.sidebar.classList.toggle("open");   // slides over the map
    } else {
      els.sidebar.classList.toggle("collapsed");
    }
    // map width may change on desktop; let Leaflet re-measure
    setTimeout(() => map.invalidateSize(), 260);
  };
  els.search.addEventListener("input", (e) => {
    searchTerm = e.target.value;
    renderList();
  });

  // ── Boot ────────────────────────────────────────────────────
  const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

  renderLegend();
  properties.forEach(addMarker);
  renderList();

  // Map initialised successfully — drop the "needs JavaScript" fallback.
  document.getElementById("mapFallback")?.remove();

  // Leaflet must re-measure once layout has settled, otherwise tiles
  // can fail to fill the container (common when loaded inside a viewer).
  const fixSize = () => map.invalidateSize();
  window.addEventListener("resize", fixSize);
  window.addEventListener("orientationchange", () => setTimeout(fixSize, 300));
  setTimeout(fixSize, 200);
  setTimeout(fixSize, 600);
})();

  </script>
</body>
</html>
